services:
  lectern:
    build:
      context: .
    image: lectern-server-cpp:${TAG:-latest}
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    environment:
      # Compose refuses to start without this set — an unsigned session cookie
      # is fine on a laptop, not on anything reachable.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: ${PORT:-8080}
      WORKSPACE_QUOTA_BYTES: ${WORKSPACE_QUOTA_BYTES:-268435456}
      # Raised from axum's old 2MB default; a .mdn notebook passes that
      # routinely and the first sync then failed with 413.
      MAX_WORK_FILE_BYTES: ${MAX_WORK_FILE_BYTES:-33554432}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DESKTOP_RELEASES_REPO: ${DESKTOP_RELEASES_REPO:-Decumano/OfficeSuite}
      GITHUB_RELEASES_TOKEN: ${GITHUB_RELEASES_TOKEN:-}
      THREADS: ${THREADS:-8}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # The container always stores under /data (DATA_DIR in the image), so
      # state survives down/up cycles. What that maps to on the host is the
      # .env's call: LECTERN_DATA unset keeps the managed named volume, and
      # setting it to a path — LECTERN_DATA=/srv/lectern-data — makes this a
      # bind mount to that directory instead.
      - ${LECTERN_DATA:-lectern-data}:/data
    restart: unless-stopped
    # PDF export runs Chromium, which wants more shared memory than
    # Docker's 64MB default. --disable-dev-shm-usage covers this too;
    # both together keep large exports off the failure path.
    shm_size: 512m

volumes:
  lectern-data:
