<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folio — Office Suite</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0e0c; --bg2: #1a1916; --bg3: #232220; --bg4: #2d2c29;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
  --text: #f0ede6; --text2: #9e9b94; --text3: #5c5a55;
  --accent: #d4a843; --accent2: #b8912e;
  --accent-dim: rgba(212,168,67,0.12); --accent-dim2: rgba(212,168,67,0.06);
  --red: #c0574a; --green: #5a9a6e; --blue: #4a7fa8;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
  --serif: Georgia, 'Times New Roman', serif;
  --radius: 8px; --radius-lg: 14px;
  --sidebar-w: 260px; --toolbar-h: 48px;
}
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); }
#app { display: flex; height: 100vh; }
#sidebar { width: var(--sidebar-w); background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-logo { padding: 20px 20px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #0f0e0c; flex-shrink: 0; font-weight: 700; font-family: var(--serif); }
.logo-text { font-family: var(--serif); font-size: 20px; color: var(--text); letter-spacing: -0.02em; }
.logo-sub { font-size: 10px; color: var(--text3); font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 1px; }
.sidebar-section { padding: 12px 12px 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); }
.app-tabs { display: flex; gap: 4px; padding: 8px 12px; }
.app-tab { flex: 1; padding: 6px 4px; border-radius: var(--radius); border: 1px solid transparent; background: transparent; color: var(--text2); font-family: var(--sans); font-size: 11px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; transition: all 0.15s; }
.app-tab:hover { background: var(--bg3); color: var(--text); }
.app-tab.active { background: var(--accent-dim); border-color: rgba(212,168,67,0.25); color: var(--accent); }
.app-tab svg { width: 14px; height: 14px; }
#file-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
#file-list::-webkit-scrollbar { width: 4px; }
#file-list::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }
.file-item { padding: 8px 10px; border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.12s; border: 1px solid transparent; }
.file-item:hover { background: var(--bg3); }
.file-item.active { background: var(--accent-dim); border-color: rgba(212,168,67,0.18); }
.file-icon { width: 14px; height: 14px; flex-shrink: 0; color: var(--text3); }
.file-item.active .file-icon { color: var(--accent); }
.file-info { flex: 1; min-width: 0; }
.file-name { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.file-meta { font-size: 10px; color: var(--text3); margin-top: 1px; font-family: var(--mono); }
.file-item.active .file-name { color: var(--accent); }
.file-del { opacity: 0; width: 18px; height: 18px; color: var(--text3); cursor: pointer; border-radius: 4px; padding: 2px; flex-shrink: 0; transition: all 0.1s; display: flex; align-items: center; justify-content: center; }
.file-del svg { width: 12px; height: 12px; }
.file-item:hover .file-del { opacity: 1; }
.file-del:hover { color: var(--red); background: rgba(192,87,74,0.15); }
.sidebar-footer { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 6px; }
.btn-new { flex: 1; padding: 8px 12px; background: var(--accent); color: #0f0e0c; border: none; border-radius: var(--radius); font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s; }
.btn-new:hover { background: var(--accent2); }
.btn-new svg { width: 14px; height: 14px; }
.btn-icon { width: 34px; height: 34px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text2); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.btn-icon svg { width: 16px; height: 16px; }
.btn-icon:hover { background: var(--bg4); color: var(--text); border-color: var(--border2); }
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#toolbar { height: var(--toolbar-h); background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 2px; padding: 0 12px; flex-shrink: 0; }
.toolbar-group { display: flex; align-items: center; gap: 2px; }
.toolbar-sep { width: 1px; height: 20px; background: var(--border2); margin: 0 6px; flex-shrink: 0; }
.tb-btn { width: 32px; height: 32px; border: none; background: transparent; border-radius: 6px; color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.12s; }
.tb-btn svg { width: 16px; height: 16px; }
.tb-btn:hover { background: var(--bg3); color: var(--text); }
.tb-btn.active { background: var(--accent-dim); color: var(--accent); }
.tb-select { height: 30px; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--sans); font-size: 12px; padding: 0 6px; cursor: pointer; outline: none; }
.tb-select:hover { border-color: var(--border2); }
.toolbar-title { flex: 1; text-align: center; font-size: 13px; color: var(--text2); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 12px; }
.toolbar-title span { color: var(--text); }
.view-toggle { display: flex; background: var(--bg3); border: 1px solid var(--border); border-radius: 7px; padding: 2px; gap: 2px; }
.view-btn { width: 28px; height: 26px; border: none; background: transparent; border-radius: 5px; color: var(--text3); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.12s; }
.view-btn svg { width: 14px; height: 14px; }
.view-btn.active { background: var(--bg4); color: var(--text); }
.view-btn:hover:not(.active) { color: var(--text2); }
#editor-area { flex: 1; display: flex; overflow: hidden; }
#write-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#doc-title-input { padding: 28px 60px 10px; font-family: var(--serif); font-size: 32px; color: var(--text); background: transparent; border: none; outline: none; width: 100%; letter-spacing: -0.02em; border-bottom: 1px solid var(--border); }
#doc-title-input::placeholder { color: var(--text3); }
#editor { flex: 1; padding: 24px 60px 60px; font-family: var(--mono); font-size: 14px; line-height: 1.8; color: var(--text2); background: transparent; border: none; outline: none; resize: none; overflow-y: auto; white-space: pre-wrap; word-wrap: break-word; }
#editor::-webkit-scrollbar { width: 6px; }
#editor::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
#editor::placeholder { color: var(--text3); }
#preview-pane { flex: 1; border-left: 1px solid var(--border); overflow-y: auto; padding: 28px 60px 60px; display: none; }
#preview-pane::-webkit-scrollbar { width: 6px; }
#preview-pane::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
#preview-title { font-family: var(--serif); font-size: 36px; color: var(--text); letter-spacing: -0.03em; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
#preview-content { color: var(--text2); line-height: 1.8; }
#preview-content h1,#preview-content h2,#preview-content h3,#preview-content h4 { font-family: var(--serif); color: var(--text); margin: 1.6em 0 0.6em; }
#preview-content h1 { font-size: 28px; }
#preview-content h2 { font-size: 22px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
#preview-content h3 { font-size: 18px; }
#preview-content p { margin: 0 0 1em; }
#preview-content a { color: var(--accent); text-decoration: none; }
#preview-content code { background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-family: var(--mono); font-size: 12px; color: var(--accent); }
#preview-content pre { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; overflow-x: auto; margin: 1em 0; }
#preview-content pre code { background: none; border: none; padding: 0; color: var(--text2); }
#preview-content blockquote { border-left: 3px solid var(--accent); margin: 1em 0; padding: 4px 0 4px 16px; color: var(--text3); font-style: italic; }
#preview-content ul,#preview-content ol { margin: 0.5em 0 1em 1.4em; }
#preview-content li { margin: 0.2em 0; }
#preview-content table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 13px; }
#preview-content th { background: var(--bg3); border: 1px solid var(--border2); padding: 8px 12px; font-weight: 600; color: var(--text); text-align: left; }
#preview-content td { border: 1px solid var(--border); padding: 7px 12px; }
#preview-content hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
#preview-content strong { color: var(--text); font-weight: 600; }
#editor-area.split #write-pane { flex: 1; }
#editor-area.split #preview-pane { display: block; flex: 1; }
#editor-area.preview #write-pane { display: none; }
#editor-area.preview #preview-pane { display: block; flex: 1; border-left: none; }
#statusbar { height: 26px; background: var(--bg2); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; gap: 16px; flex-shrink: 0; }
.status-item { font-size: 11px; color: var(--text3); font-family: var(--mono); display: flex; align-items: center; gap: 4px; }
.status-item svg { width: 11px; height: 11px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.status-spacer { flex: 1; }
#sheet-app { flex: 1; display: none; flex-direction: column; overflow: hidden; }
#sheet-toolbar { height: 40px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.cell-ref { width: 64px; height: 26px; background: var(--bg3); border: 1px solid var(--border); border-radius: 5px; color: var(--accent); font-family: var(--mono); font-size: 12px; padding: 0 6px; outline: none; text-align: center; flex-shrink: 0; }
.formula-bar { flex: 1; height: 26px; background: var(--bg3); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-family: var(--mono); font-size: 12px; padding: 0 10px; outline: none; }
.formula-bar:focus { border-color: var(--accent); }
#sheet-container { flex: 1; overflow: auto; }
#sheet-container::-webkit-scrollbar { width: 8px; height: 8px; }
#sheet-container::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }
#sheet-container::-webkit-scrollbar-corner { background: var(--bg2); }
#sheet-grid { border-collapse: collapse; font-size: 12px; min-width: 100%; }
#sheet-grid th { position: sticky; background: var(--bg2); border: 1px solid var(--border); color: var(--text3); font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 4px 8px; white-space: nowrap; user-select: none; z-index: 2; }
#sheet-grid th.row-header { left: 0; z-index: 3; width: 44px; text-align: right; }
#sheet-grid th:first-child { top: 0; left: 0; z-index: 4; width: 44px; }
#sheet-grid .col-header { top: 0; z-index: 2; min-width: 100px; }
#sheet-grid td { border: 1px solid var(--border); padding: 0; background: var(--bg); min-width: 100px; height: 26px; }
#sheet-grid td.active { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 1; }
.cell-input { width: 100%; height: 100%; background: transparent; border: none; outline: none; padding: 0 6px; font-family: var(--mono); font-size: 12px; color: var(--text); }
.cell-input.formula-result { color: var(--accent); }
#slide-app { display: none; flex: 1; overflow: hidden; }
#presentation-app { display: flex; flex: 1; overflow: hidden; }
#slide-panel { width: 180px; background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
#slide-panel::-webkit-scrollbar { width: 4px; }
#slide-panel::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
.slide-thumb { width: 100%; aspect-ratio: 16/9; background: var(--bg3); border-radius: 6px; border: 2px solid transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; transition: border-color 0.15s; position: relative; overflow: hidden; }
.slide-thumb:hover { border-color: var(--border2); }
.slide-thumb.active { border-color: var(--accent); }
.slide-num { position: absolute; bottom: 4px; left: 6px; font-size: 9px; color: var(--text3); font-family: var(--mono); }
.slide-thumb-title { font-size: 9px; font-weight: 600; color: var(--text2); text-align: center; line-height: 1.3; }
.slide-thumb-body { font-size: 7px; color: var(--text3); text-align: center; margin-top: 3px; line-height: 1.4; }
.btn-add-slide { width: 100%; padding: 6px; background: transparent; border: 1px dashed var(--border2); border-radius: 6px; color: var(--text3); font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; transition: all 0.15s; font-family: var(--sans); }
.btn-add-slide:hover { border-color: var(--accent); color: var(--accent); }
.btn-add-slide svg { width: 12px; height: 12px; }
#slide-editor { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#slide-canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; background: var(--bg); overflow: hidden; }
#slide-canvas { width: 100%; max-width: 720px; aspect-ratio: 16/9; background: #1c1b18; border-radius: 10px; border: 1px solid var(--border2); position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 48px 56px; overflow: hidden; }
.slide-canvas-accent { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--accent); border-radius: 10px 0 0 10px; }
#slide-title-input { font-family: var(--serif); font-size: 32px; color: var(--text); background: transparent; border: none; outline: none; width: 100%; margin-bottom: 16px; letter-spacing: -0.02em; border-bottom: 1px dashed transparent; transition: border-color 0.2s; }
#slide-title-input:focus { border-bottom-color: var(--border2); }
#slide-title-input::placeholder { color: var(--text3); }
#slide-body-input { font-family: var(--sans); font-size: 15px; color: var(--text2); background: transparent; border: none; outline: none; width: 100%; line-height: 1.8; resize: none; height: 160px; }
#slide-body-input::placeholder { color: var(--text3); }
#slide-props { height: 44px; background: var(--bg2); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; padding: 0 16px; }
.prop-label { font-size: 11px; color: var(--text3); }
.prop-select { height: 28px; background: var(--bg3); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-family: var(--sans); font-size: 11px; padding: 0 6px; outline: none; cursor: pointer; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; }
.modal-overlay.open { display: flex; }
.modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 24px; width: 400px; display: flex; flex-direction: column; gap: 16px; }
.modal h3 { font-family: var(--serif); font-size: 22px; color: var(--text); }
.modal-input { width: 100%; height: 38px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text); font-family: var(--sans); font-size: 14px; padding: 0 12px; outline: none; }
.modal-input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.btn-cancel { padding: 8px 16px; background: transparent; border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text2); font-family: var(--sans); font-size: 13px; cursor: pointer; }
.btn-create { padding: 8px 16px; background: var(--accent); border: none; border-radius: var(--radius); color: #0f0e0c; font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; }
.modal-type-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.type-card { padding: 12px 8px; background: var(--bg3); border: 2px solid transparent; border-radius: var(--radius); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.15s; }
.type-card:hover { border-color: var(--border2); }
.type-card.selected { border-color: var(--accent); background: var(--accent-dim); }
.type-card svg { width: 22px; height: 22px; color: var(--text2); }
.type-card.selected svg { color: var(--accent); }
.type-card span { font-size: 11px; color: var(--text2); font-weight: 500; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">F</div>
      <div>
        <div class="logo-text">Folio</div>
        <div class="logo-sub">Office Suite</div>
      </div>
    </div>
    <div class="app-tabs">
      <button class="app-tab active" onclick="switchAppType('doc')" id="tab-doc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></svg>
        Docs
      </button>
      <button class="app-tab" onclick="switchAppType('sheet')" id="tab-sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        Sheets
      </button>
      <button class="app-tab" onclick="switchAppType('slide')" id="tab-slide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Slides
      </button>
    </div>
    <div class="sidebar-section">Files</div>
    <div id="file-list"></div>
    <div class="sidebar-footer">
      <button class="btn-new" onclick="openNewModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New
      </button>
      <button class="btn-icon" onclick="exportCurrent()" title="Export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="btn-icon" onclick="triggerImport()" title="Import">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
    </div>
  </div>

  <div id="main">
    <!-- DOC APP -->
    <div id="doc-app" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
      <div id="toolbar">
        <div class="toolbar-group">
          <select class="tb-select" id="heading-sel" onchange="applyHeading(this.value)">
            <option value="">Paragraph</option>
            <option value="# ">Heading 1</option>
            <option value="## ">Heading 2</option>
            <option value="### ">Heading 3</option>
          </select>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
          <button class="tb-btn" title="Bold" onclick="wrapSel('**','**')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg></button>
          <button class="tb-btn" title="Italic" onclick="wrapSel('*','*')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg></button>
          <button class="tb-btn" title="Strikethrough" onclick="wrapSel('~~','~~')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><path d="M16 6C16 6 14.5 4 12 4s-5 1.5-5 4c0 5 10 3 10 8 0 2.5-2 4-5 4s-5-1.5-5-4"/></svg></button>
          <button class="tb-btn" title="Code" onclick="wrapSel('`','`')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16,18 22,12 16,6"/><polyline points="8,6 2,12 8,18"/></svg></button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">

            </select>

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,6 5,6 21,6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

<script>
// ── STATE ──
let files = {};
let currentFileId = null;
let currentAppType = 'doc';
let newFileType = 'doc';
let editorView = 'write';
let saveTimer = null;
let sheetData = {};
let activeCell = { row: 1, col: 1 };
let ROWS = 40, COLS = 26;
let slides = [];
let currentSlide = 0;

function init() {
  loadFromStorage();
  renderFileList();
  buildSheet();
  if (Object.keys(files).length === 0) {
    const id = createFile('Welcome to Folio', 'doc',
`# Welcome to Folio\n\n'
      + 'Folio is a lightweight office suite that stores everything in **Markdown**.\n\n'
      + '## Features\n\n'
      + '- **Documents** \u2014 rich markdown editing with live preview\n'
      + '- **Spreadsheets** \u2014 formula-capable grid stored as CSV in markdown\n'
      + '- **Presentations** \u2014 slide editor with markdown content\n\n'
      + '## Markdown Quick Reference\n\n'
      + '| Element | Syntax |\n'
      + '|---------|--------|\n'
      + '| Bold | \u0060**text**\u0060 |\n'
      + '| Italic | \u0060*text*\u0060 |\n'
      + '| Heading | \u0060# H1\u0060 \u0060## H2\u0060 |\n'
      + '| List | \u0060- item\u0060 |\n'
      + '| Blockquote | \u0060> text\u0060 |\n'
      + '| Code | \u0060 \u0060\u0060 \u0060code\u0060 \u0060\u0060 \u0060 |\n'
      + '| Link | \u0060[text](url)\u0060 |\n\n'
      + '## Getting Started\n\n'
      + '1. Click **New** in the sidebar to create a file\n'
      + '2. Write in Markdown \u2014 use the toolbar for formatting\n'
      + '3. Toggle the **split** view button to preview alongside your writing\n'
      + '4. Click the **download** button to export your file\n\n'
      + '> All files are saved automatically to your browser\'s local storage.\n\n'
      + '---\n\n'
      + 'Happy writing!';`);
    openFile(id);
  }
}

function saveToStorage() {
  try { localStorage.setItem('folio_v2', JSON.stringify(files)); } catch(e) { console.warn('Storage error', e); }
}
function loadFromStorage() {
  try { const d = localStorage.getItem('folio_v2'); if (d) files = JSON.parse(d); } catch(e) { files = {}; }
}

function createFile(name, type, content) {
  const id = 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  if (content === undefined) {
    if (type === 'sheet') content = '---\ntype: spreadsheet\n---\n\n';
    else if (type === 'slide') content = '---\ntype: presentation\n---\n\n# New Slide\nYour content here\n';
    else content = '';
  }
  files[id] = { name, type, content, modified: Date.now() };
  saveToStorage();
  return id;
}

function renderFileList() {
  const el = document.getElementById('file-list');
  const filtered = Object.entries(files).filter(([,f]) => f.type === currentAppType);
  filtered.sort((a,b) => b[1].modified - a[1].modified);
  if (filtered.length === 0) {
    el.innerHTML = '<div style="padding:20px 12px;text-align:center;color:var(--text3);font-size:12px;">No files yet.<br>Click <strong style=\"color:var(--accent)\">+ New</strong> to start.</div>';
    return;
  }
  el.innerHTML = filtered.map(([id,f]) => {
    const active = id === currentFileId;
    const icon = f.type === 'sheet'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>'
      : f.type === 'slide'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>';
    const date = new Date(f.modified).toLocaleDateString(undefined,{month:'short',day:'numeric'});
    return '<div class="file-item ' + (active?'active':'') + '" onclick="openFile(\'' + id + '\')">'
      + '<span class="file-icon">' + icon + '</span>'
      + '<div class="file-info"><div class="file-name">' + escHtml(f.name) + '</div><div class="file-meta">' + date + '</div></div>'
      + '<span class="file-del" onclick="deleteFile(event,\'' + id + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>'
      + '</div>';
  }).join('');
}

function openFile(id) {
  if (!files[id]) return;
  currentFileId = id;
  const f = files[id];
  switchAppType(f.type, false);
  renderFileList();
  if (f.type === 'doc') loadDocFile(f);
  else if (f.type === 'sheet') loadSheetFile(f);
  else loadSlideFile(f);
}

function deleteFile(e, id) {
  e.stopPropagation();
  if (!confirm('Delete "' + files[id].name + '"?')) return;
  delete files[id];
  if (currentFileId === id) { currentFileId = null; document.getElementById('doc-title-input').value = ''; document.getElementById('editor').value = ''; document.getElementById('toolbar-title').innerHTML = '<span>No document open</span>'; updatePreview(); updateStatus(); }
  saveToStorage();
  renderFileList();
}

function switchAppType(type, rerender) {
  if (rerender === undefined) rerender = true;
  currentAppType = type;
  document.getElementById('doc-app').style.display = type === 'doc' ? 'flex' : 'none';
  document.getElementById('sheet-app').style.display = type === 'sheet' ? 'flex' : 'none';
  document.getElementById('slide-app').style.display = type === 'slide' ? 'flex' : 'none';
  document.querySelectorAll('.app-tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('tab-' + type).classList.add('active');
  if (rerender) renderFileList();
}

// ── DOC ──
function loadDocFile(f) {
  document.getElementById('doc-title-input').value = f.name;
  document.getElementById('editor').value = f.content || '';
  document.getElementById('toolbar-title').innerHTML = '<span>' + escHtml(f.name) + '</span>';
  updatePreview(); updateStatus();
}
function onDocTitleChange() {
  if (!currentFileId || files[currentFileId].type !== 'doc') return;
  files[currentFileId].name = document.getElementById('doc-title-input').value || 'Untitled';
  document.getElementById('toolbar-title').innerHTML = '<span>' + escHtml(files[currentFileId].name) + '</span>';
  scheduleSave(); renderFileList();
}
function onEditorChange() {
  if (!currentFileId) return;
  files[currentFileId].content = document.getElementById('editor').value;
  updatePreview(); updateStatus(); scheduleSave();
}
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function() { if (currentFileId) files[currentFileId].modified = Date.now(); saveToStorage(); renderFileList(); }, 800);
}
function updatePreview() {
  document.getElementById('preview-title').textContent = document.getElementById('doc-title-input').value;
  document.getElementById('preview-content').innerHTML = typeof marked !== 'undefined' ? marked.parse(document.getElementById('editor').value) : document.getElementById('editor').value;
}
function updateStatus() {
  var text = document.getElementById('editor').value;
  var words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('word-count').textContent = words;
  document.getElementById('char-count').textContent = text.length;
}
document.getElementById('editor').addEventListener('keyup', function(e) {
  var el = e.target;
  var lines = el.value.substr(0, el.selectionStart).split('\n');
  document.getElementById('cursor-pos').textContent = 'Ln ' + lines.length + ', Col ' + (lines[lines.length-1].length+1);
});
function handleEditorKey(e) {
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'b') { e.preventDefault(); wrapSel('**','**'); }
    if (e.key === 'i') { e.preventDefault(); wrapSel('*','*'); }
    if (e.key === 's') { e.preventDefault(); saveToStorage(); }
  }
  if (e.key === 'Tab') { e.preventDefault(); var el = e.target, s = el.selectionStart; el.value = el.value.slice(0,s)+'  '+el.value.slice(el.selectionEnd); el.selectionStart = el.selectionEnd = s+2; onEditorChange(); }
}
document.addEventListener('keydown', function(e) { if ((e.ctrlKey||e.metaKey) && e.key==='n') { e.preventDefault(); openNewModal(); } });

function wrapSel(before, after) {
  var el = document.getElementById('editor'), s = el.selectionStart, end = el.selectionEnd, sel = el.value.slice(s,end);
  el.value = el.value.slice(0,s)+before+sel+after+el.value.slice(end);
  el.selectionStart = s+before.length; el.selectionEnd = end+before.length;
  el.focus(); onEditorChange();
}
function insertLine(prefix) {
  var el = document.getElementById('editor'), s = el.selectionStart, lineStart = el.value.lastIndexOf('\n',s-1)+1;
  el.value = el.value.slice(0,lineStart)+prefix+el.value.slice(lineStart);
  el.selectionStart = el.selectionEnd = lineStart+prefix.length+(s-lineStart);
  el.focus(); onEditorChange();
}
function applyHeading(prefix) { if (!prefix) return; insertLine(prefix); document.getElementById('heading-sel').value = ''; }
function insertCodeBlock() {
  var el = document.getElementById('editor'), s = el.selectionStart, ins = '\n```\n'+el.value.slice(s,el.selectionEnd)+'\n```\n';
  el.value = el.value.slice(0,s)+ins+el.value.slice(el.selectionEnd);
  el.selectionStart = el.selectionEnd = s+5; el.focus(); onEditorChange();
}
function insertTable() {
  var tbl = '\n| Column 1 | Column 2 | Column 3 |\n|----------|----------|----------|\n| Cell | Cell | Cell |\n| Cell | Cell | Cell |\n';
  var el = document.getElementById('editor'), s = el.selectionStart;
  el.value = el.value.slice(0,s)+tbl+el.value.slice(s);
  el.selectionStart = el.selectionEnd = s+tbl.length; el.focus(); onEditorChange();
}
function insertLink() {
  var url = prompt('URL:', 'https://'); if (!url) return; wrapSel('[', ']('+url+')');
}
function setView(v) {
  editorView = v;
  document.getElementById('editor-area').className = v === 'write' ? '' : v;
  ['write','split','preview'].forEach(function(x) { document.getElementById('vbtn-'+x).classList.toggle('active', x===v); });
  if (v !== 'write') updatePreview();
}

// ── SHEET ──
function buildSheet() {
  var head = document.getElementById('sheet-head');
  var hr = '<tr><th class="row-header" style="top:0;left:0;z-index:4;"></th>';
  for (var c=0;c<COLS;c++) hr += '<th class="col-header">'+colName(c)+'</th>';
  head.innerHTML = hr + '</tr>';
  var body = document.getElementById('sheet-body'), html = '';
  for (var r=1;r<=ROWS;r++) {
    html += '<tr><th class="row-header" style="position:sticky;left:0;z-index:1;">'+r+'</th>';
    for (var c2=0;c2<COLS;c2++) {
      var ref = colName(c2)+r;
      html += '<td id="cell-'+ref+'" onclick="selectCell(\''+ref+'\')"><input class="cell-input" id="inp-'+ref+'" value="" onkeydown="cellKey(event,\''+ref+'\')" onfocus="onCellFocus(\''+ref+'\')" oninput="onCellInput(\''+ref+'\')"></td>';
    }
    html += '</tr>';
  }
  document.getElementById('sheet-body').innerHTML = html;
}
function colName(i) { return String.fromCharCode(65+i); }
function colIdx(ch) { return ch.charCodeAt(0)-65; }
function parseRef(ref) { var m=ref.match(/^([A-Z]+)(\d+)$/); if(!m) return null; return {col:m[1],row:parseInt(m[2])}; }
function selectCell(ref) {
  document.querySelectorAll('#sheet-body td.active').forEach(function(el){el.classList.remove('active');});
  var p = parseRef(ref); if(!p) return;
  activeCell = {row:p.row,col:colIdx(p.col)};
  var td = document.getElementById('cell-'+ref); if(td) td.classList.add('active');
  document.getElementById('cell-ref').value = ref;
  document.getElementById('formula-bar').value = sheetData[ref]||'';
}
function onCellFocus(ref) { selectCell(ref); }
function onCellInput(ref) {
  sheetData[ref] = document.getElementById('inp-'+ref).value;
  evaluateFormulas(); saveSheetToFile();
}
function cellKey(e,ref) {
  var p=parseRef(ref), nr=p.row, nc=colIdx(p.col);
  if(e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();nr++;}
  else if(e.key==='ArrowUp'){e.preventDefault();nr--;}
  else if(e.key==='Tab'||e.key==='ArrowRight'){e.preventDefault();nc++;}
  else if(e.key==='ArrowLeft'){e.preventDefault();nc--;}
  else return;
  nr=Math.max(1,Math.min(ROWS,nr)); nc=Math.max(0,Math.min(COLS-1,nc));
  var next=colName(nc)+nr, inp=document.getElementById('inp-'+next);
  if(inp){inp.focus();selectCell(next);}
}
function formulaBarKey(e) {
  if(e.key!=='Enter') return;
  var ref=document.getElementById('cell-ref').value, val=document.getElementById('formula-bar').value;
  sheetData[ref]=val;
  var inp=document.getElementById('inp-'+ref);
  if(inp){inp.value=evalCell(ref,val);inp.classList.toggle('formula-result',val.startsWith('='));}
  evaluateFormulas(); saveSheetToFile();
}
function formulaBarInput() {
  var ref=document.getElementById('cell-ref').value, val=document.getElementById('formula-bar').value;
  sheetData[ref]=val;
  var inp=document.getElementById('inp-'+ref); if(inp) inp.value=val;
}
function evalCell(ref,val) {
  if(!val||!val.startsWith('=')) return val;
  try {
    var expr=val.slice(1)
      .replace(/SUM\(([^)]+)\)/gi,function(_,r){return sumRange(r);})
      .replace(/AVG\(([^)]+)\)/gi,function(_,r){return avgRange(r);})
      .replace(/COUNT\(([^)]+)\)/gi,function(_,r){return countRange(r);})
      .replace(/MAX\(([^)]+)\)/gi,function(_,r){return maxRange(r);})
      .replace(/MIN\(([^)]+)\)/gi,function(_,r){return minRange(r);})
      .replace(/([A-Z])(\d+)/g,function(_,c,r){var v=sheetData[c+r]||'0';return isNaN(parseFloat(v))?'0':v;});
    var result=Function('"use strict";return ('+expr+')')();
    return isNaN(result)?'#ERR':parseFloat(result.toFixed(10)).toString();
  } catch(e){return '#ERR';}
}
function getRangeVals(range) {
  var parts=range.split(':');
  if(parts.length===1) return [parseFloat(sheetData[parts[0].trim()])||0];
  var pa=parseRef(parts[0].trim()),pb=parseRef(parts[1].trim()); if(!pa||!pb) return [];
  var vals=[];
  for(var r=pa.row;r<=pb.row;r++) for(var c=colIdx(pa.col);c<=colIdx(pb.col);c++) vals.push(parseFloat(sheetData[colName(c)+r])||0);
  return vals;
}
function sumRange(r){return getRangeVals(r).reduce(function(a,b){return a+b;},0);}
function avgRange(r){var v=getRangeVals(r);return v.length?v.reduce(function(a,b){return a+b;},0)/v.length:0;}
function countRange(r){return getRangeVals(r).length;}
function maxRange(r){return Math.max.apply(null,getRangeVals(r));}
function minRange(r){return Math.min.apply(null,getRangeVals(r));}
function evaluateFormulas() {
  Object.keys(sheetData).forEach(function(ref) {
    var val=sheetData[ref];
    if(val&&val.startsWith('=')) {
      var inp=document.getElementById('inp-'+ref);
      if(inp){inp.value=evalCell(ref,val);inp.classList.add('formula-result');}
    }
  });
}
function loadSheetFile(f) {
  sheetData={};
  var lines=(f.content||'').split('\n'), dataStart=0;
  if(lines[0]==='---'){var end=lines.indexOf('---',1);dataStart=end+2;}
  lines.slice(dataStart).forEach(function(line,ri){
    if(!line.trim()) return;
    line.split(',').forEach(function(cell,ci){
      if(ci<COLS&&ri<ROWS){sheetData[colName(ci)+(ri+1)]=cell.trim();}
    });
  });
  for(var r=1;r<=ROWS;r++) for(var c=0;c<COLS;c++){
    var ref=colName(c)+r, v=sheetData[ref]||'', inp=document.getElementById('inp-'+ref);
    if(inp){inp.value=v.startsWith('=')?evalCell(ref,v):v;inp.classList.toggle('formula-result',v.startsWith('='));}
  }
  selectCell('A1');
}
function saveSheetToFile() {
  if(!currentFileId) return;
  var csv='---\ntype: spreadsheet\n---\n\n';
  for(var r=1;r<=ROWS;r++){
    var row=[];
    for(var c=0;c<COLS;c++) row.push(sheetData[colName(c)+r]||'');
    while(row.length&&!row[row.length-1]) row.pop();
    if(row.some(function(v){return v;})) csv+=row.join(',')+'\n';
  }
  files[currentFileId].content=csv; files[currentFileId].modified=Date.now();
  saveToStorage(); renderFileList();
}

// ── SLIDES ──
function loadSlideFile(f) {
  slides=[];
  var content=(f.content||'').replace(/^---[\s\S]*?---\n\n?/,'');
  var parts=content.split(/\n---\n/);
  parts.forEach(function(part){
    var lines=part.trim().split('\n');
    var title=lines[0]?lines[0].replace(/^#+\s*/,''):'Slide';
    var body=lines.slice(1).join('\n').trim();
    slides.push({title:title,body:body,layout:'Title & Body',theme:'Dark'});
  });
  if(slides.length===0) slides.push({title:'New Slide',body:'',layout:'Title & Body',theme:'Dark'});
  currentSlide=0; renderSlideThumbs(); loadSlideEditor(0);
}
function renderSlideThumbs() {
  document.getElementById('slide-thumbs').innerHTML=slides.map(function(s,i){
    return '<div class="slide-thumb '+(i===currentSlide?'active':'')+'" onclick="switchSlide('+i+')">'
      +'<div class="slide-thumb-title">'+escHtml(s.title||'Untitled')+'</div>'
      +'<div class="slide-thumb-body">'+escHtml((s.body||'').slice(0,60))+'</div>'
      +'<span class="slide-num">'+(i+1)+'</span></div>';
  }).join('');
}
function loadSlideEditor(idx) {
  var s=slides[idx];
  document.getElementById('slide-title-input').value=s.title||'';
  document.getElementById('slide-body-input').value=s.body||'';
}
function switchSlide(idx) { currentSlide=idx; renderSlideThumbs(); loadSlideEditor(idx); }
function onSlideTitleChange() { slides[currentSlide].title=document.getElementById('slide-title-input').value; renderSlideThumbs(); saveSlidesToFile(); }
function onSlideBodyChange() { slides[currentSlide].body=document.getElementById('slide-body-input').value; renderSlideThumbs(); saveSlidesToFile(); }
function onSlideLayoutChange(v) { slides[currentSlide].layout=v; saveSlidesToFile(); }
function onSlideThemeChange(v) { slides[currentSlide].theme=v; }
function addSlide() {
  slides.splice(currentSlide+1,0,{title:'New Slide',body:'',layout:'Title & Body',theme:'Dark'});
  currentSlide++; renderSlideThumbs(); loadSlideEditor(currentSlide); saveSlidesToFile();
}
function deleteCurrentSlide() {
  if(slides.length<=1) return;
  slides.splice(currentSlide,1); currentSlide=Math.min(currentSlide,slides.length-1);
  renderSlideThumbs(); loadSlideEditor(currentSlide); saveSlidesToFile();
}
function saveSlidesToFile() {
  if(!currentFileId) return;
  var md='---\ntype: presentation\n---\n\n';
  md+=slides.map(function(s){return '# '+s.title+'\n'+s.body;}).join('\n---\n');
  files[currentFileId].content=md; files[currentFileId].modified=Date.now();
  saveToStorage(); renderFileList();
}

// ── MODAL ──
function openNewModal() {
  newFileType=currentAppType;
  document.getElementById('new-modal').classList.add('open');
  document.getElementById('new-name').value='';
  setTimeout(function(){document.getElementById('new-name').focus();},50);
  document.querySelectorAll('.type-card').forEach(function(c,i){c.classList.toggle('selected',['doc','sheet','slide'][i]===newFileType);});
}
function closeNewModal() { document.getElementById('new-modal').classList.remove('open'); }
function selectNewType(type,el) { newFileType=type; document.querySelectorAll('.type-card').forEach(function(c){c.classList.remove('selected');}); el.classList.add('selected'); }
function createNewFile() {
  var name=document.getElementById('new-name').value.trim()||'Untitled';
  var id=createFile(name,newFileType);
  closeNewModal(); switchAppType(newFileType); openFile(id);
}
document.getElementById('new-modal').addEventListener('click',function(e){if(e.target===document.getElementById('new-modal'))closeNewModal();});

// ── EXPORT / IMPORT ──
function exportCurrent() {
  if(!currentFileId){alert('No file open.');return;}
  var f=files[currentFileId], ext=f.type==='sheet'?'csv':'md';
  var blob=new Blob([f.content],{type:'text/plain'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=f.name.replace(/\s+/g,'_')+'.'+ext;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function triggerImport() { document.getElementById('import-input').click(); }
function handleImport(e) {
  var file=e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var content=ev.target.result, type=file.name.endsWith('.csv')?'sheet':'doc';
    var name=file.name.replace(/\.[^.]+$/,'');
    var id=createFile(name,type,content);
    switchAppType(type); openFile(id);
  };
  reader.readAsText(file); e.target.value='';
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

init();
</script>
