[package]
name = "officesuite-web"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace"] }
sha2 = "0.10"
tower-sessions = { version = "0.12", features = ["signed"] }
tower-sessions-sqlx-store = { version = "0.13", features = ["sqlite"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "uuid", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
rand_core = { version = "0.6", features = ["std"] }
anyhow = "1"
time = "0.3"
headless_chrome = "1.0.22"
tempfile = "3.27"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
